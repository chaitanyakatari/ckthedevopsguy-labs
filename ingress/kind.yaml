kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ck-ingress
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0
  - role: worker
    image: kindest/node:v1.37.0
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - {containerPort: 80, hostPort: 8880, listenAddress: "127.0.0.1"}     # ingress-nginx (hostPort 80)
      - {containerPort: 30080, hostPort: 8890, listenAddress: "127.0.0.1"}  # Envoy Gateway (NodePort 30080)
