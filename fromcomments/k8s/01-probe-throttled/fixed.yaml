apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  namespace: shop
  labels: {app: orders-api}
spec:
  replicas: 1
  selector: {matchLabels: {app: orders-api}}
  template:
    metadata: {labels: {app: orders-api}}
    spec:
      enableServiceLinks: false
      containers:
        - name: orders-api
          image: ckthedevopsguy/orders-api:1.5.1
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "(sleep 100; for i in 1 2 3 4 5 6; do python -c 'while True: sum(range(10000))' & done; wait) & exec python /srv/app.py"]
          ports: [{containerPort: 8080}]
          envFrom:
            - secretRef: {name: orders-db}
          resources:
            requests: {cpu: 250m, memory: 128Mi}
            limits: {cpu: 500m, memory: 128Mi}
          readinessProbe:
            httpGet: {path: /ready, port: 8080}
            periodSeconds: 5
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: orders-api
  namespace: shop
spec:
  selector: {app: orders-api}
  ports: [{port: 80, targetPort: 8080}]
