apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  namespace: shop
  labels: {app: orders-api}
spec:
  replicas: 1
  selector: {matchLabels: {app: orders-api}}
  template:
    metadata: {labels: {app: orders-api}}
    spec:
      enableServiceLinks: false
      containers:
        - name: orders-api
          image: ckthedevopsguy/orders-api:1.4.2
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8080}]
          env:
            - {name: CACHE_WARM_MB, value: "256"}
          envFrom:
            - secretRef: {name: orders-db}
          resources:
            requests: {cpu: 50m, memory: 320Mi}
            limits: {memory: 384Mi}
