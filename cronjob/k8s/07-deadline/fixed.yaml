apiVersion: batch/v1
kind: CronJob
metadata:
  name: orders-report
  namespace: shop
spec:
  schedule: "* * * * *"
  jobTemplate:
    spec:
      activeDeadlineSeconds: 120
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: report
              image: busybox:1.37
              command: [sh, -c, 'sleep 30; wget -qO- http://orders-api/orders && echo report sent']
