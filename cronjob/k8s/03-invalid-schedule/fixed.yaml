apiVersion: batch/v1
kind: CronJob
metadata:
  name: orders-report
  namespace: shop
spec:
  schedule: "0 6 * * MON-FRI"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: report
              image: busybox:1.37
              command: [sh, -c, 'wget -qO- http://orders-api/orders && echo report sent']
