apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-report
  namespace: shop
spec:
  replicas: 1
  selector: {matchLabels: {app: orders-report}}
  template:
    metadata: {labels: {app: orders-report}}
    spec:
      nodeSelector: {kubernetes.io/hostname: ck-evict-worker}
      containers:
        - name: report
          image: busybox:1.36
          command: ["sh", "-c", "dd if=/dev/zero of=/tmp/report.bin bs=1M count=100; sleep 3600"]
          resources:
            limits: {ephemeral-storage: 50Mi}
