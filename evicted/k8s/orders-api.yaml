apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  namespace: shop
spec:
  replicas: 1
  selector: {matchLabels: {app: orders-api}}
  template:
    metadata: {labels: {app: orders-api}}
    spec:
      enableServiceLinks: false
      nodeSelector: {kubernetes.io/hostname: ck-evict-worker}
      containers:
        - name: api
          image: ckthedevopsguy/orders-api:1.5.1
          envFrom: [{secretRef: {name: orders-db}}]
          resources:
            requests: {memory: 128Mi, cpu: 100m, ephemeral-storage: 100Mi}
            limits: {memory: 128Mi, cpu: 100m, ephemeral-storage: 200Mi}
