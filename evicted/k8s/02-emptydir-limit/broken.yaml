apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-cache
  namespace: shop
spec:
  replicas: 1
  selector: {matchLabels: {app: orders-cache}}
  template:
    metadata: {labels: {app: orders-cache}}
    spec:
      nodeSelector: {kubernetes.io/hostname: ck-evict-worker}
      containers:
        - name: cache
          image: busybox:1.36
          command: ["sh", "-c", "dd if=/dev/zero of=/cache/blob bs=1M count=100; sleep 3600"]
          volumeMounts: [{name: cache, mountPath: /cache}]
      volumes:
        - name: cache
          emptyDir: {sizeLimit: 20Mi}
