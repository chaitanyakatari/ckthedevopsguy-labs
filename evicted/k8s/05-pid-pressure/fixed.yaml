apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-pool
  namespace: shop
spec:
  replicas: 1
  selector: {matchLabels: {app: worker-pool}}
  template:
    metadata: {labels: {app: worker-pool}}
    spec:
      nodeSelector: {kubernetes.io/hostname: ck-evict-worker}
      containers:
        - name: pool
          image: busybox:1.36
          command: ["sh", "-c", "for i in $(seq 20); do sleep 3600 & done; wait"]
