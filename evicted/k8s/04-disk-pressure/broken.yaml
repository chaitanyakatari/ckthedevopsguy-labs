apiVersion: v1
kind: Pod
metadata:
  name: log-shipper
  namespace: shop
  labels: {app: log-shipper}
spec:
  nodeSelector: {kubernetes.io/hostname: ck-evict-worker}
  containers:
    - name: shipper
      image: busybox:1.36
      command: ["sh", "-c", "dd if=/dev/zero of=/spool/buffer bs=1M count=2500; sleep 3600"]
      volumeMounts: [{name: spool, mountPath: /spool}]
  volumes:
    - name: spool
      emptyDir: {}
